name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-linux:
    name: Engine on Linux, with real shells
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shells and programs the tests drive
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y zsh vim
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        run: cargo test -p tterm-engine

  macos:
    name: App for macOS (Intel and Apple silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: The page of tTerm Web, at WEB_COMMIT
        run: sh scripts/web.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Engine tests on macOS, with its bash and zsh
        run: cargo test -p tterm-engine
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tauri's command line
        run: npm install --no-save --prefix "$RUNNER_TEMP/tauri" @tauri-apps/cli@2
      - name: Build tTerm.app and the disk image
        working-directory: app
        run: |
          "$RUNNER_TEMP/tauri/node_modules/.bin/tauri" build --target universal-apple-darwin --bundles app,dmg
      - name: What was built
        run: |
          ls -la target/universal-apple-darwin/release/bundle/dmg
          lipo -info target/universal-apple-darwin/release/bundle/macos/tTerm.app/Contents/MacOS/tterm
      - uses: actions/upload-artifact@v7
        with:
          name: tTerm-macOS
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
