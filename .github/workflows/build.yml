name: Build

# tTerm for Mac: the engine's checks on Linux and on macOS, and tTerm.app
# for Intel and Apple silicon in one, signed with tTerm's certificate
# (scripts/sign-mac.sh): the disk image people download, and the app for
# updates (scripts/pack-mac.sh). A tag vX.Y.Z makes a release of them,
# the repository's Latest, with the list of its files signed by the
# release key: apps of 0.5.0 and later take a version only with that
# signature (the engine's update.rs). The agent's own build and releases
# are agent.yml's.
#
# The actions are pinned to their commits, and Tauri's command line to its
# version: what this builds, a tag releases, and apps out there take it
# within hours.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-linux:
    name: Engine on Linux, with real shells
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shells and programs the tests drive
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y zsh vim
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Tests
        run: cargo test --locked -p tterm-engine --features cloud

  macos:
    name: App for macOS (Intel and Apple silicon)
    runs-on: macos-15
    env:
      # A tag is a release: signed with tTerm's certificate, or not at all.
      TTERM_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The page of tTerm Web, at WEB_COMMIT
        run: sh scripts/web.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Engine tests on macOS, with its bash and zsh
        run: cargo test --locked -p tterm-engine --features cloud
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tauri's command line
        run: npm install --no-save --prefix "$RUNNER_TEMP/tauri" @tauri-apps/cli@2.12.4
      - name: Build tTerm.app
        working-directory: app
        run: |
          "$RUNNER_TEMP/tauri/node_modules/.bin/tauri" build --target universal-apple-darwin --bundles app
          lipo -info ../target/universal-apple-darwin/release/bundle/macos/tTerm.app/Contents/MacOS/tterm
      - name: Signed with tTerm's certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: sh scripts/sign-mac.sh target/universal-apple-darwin/release/bundle/macos/tTerm.app net.tterm.desktop
      - name: The disk image, and the app for updates
        run: |
          version=""
          if [ "$TTERM_RELEASE" = 1 ]; then version="${GITHUB_REF_NAME#v}"; fi
          sh scripts/pack-mac.sh target/universal-apple-darwin/release/bundle/macos/tTerm.app out "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tTerm-macOS
          path: |
            out/tTerm.dmg
            out/tTerm.app.tar.gz
          if-no-files-found: error
          retention-days: 30

  # A tag vX.Y.Z: the two files above become a release, the repository's
  # Latest, with the list of them and their checksums, tterm-app.json,
  # signed by the release key (its private half only in this repository's
  # secrets, AGENT_SIGNING_KEY: the agent's releases are signed with it
  # too). The list says it is the app's, so that the agent's, signed with
  # the same key, is never taken for it.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine-linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the app's version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qxF "version = \"$v\"" Cargo.toml || { echo "Cargo.toml does not say $v"; exit 1; }
          grep -qF "\"version\": \"$v\"" app/tauri.conf.json || { echo "app/tauri.conf.json does not say $v"; exit 1; }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tTerm-macOS
          path: files
      - name: The list of the files, signed
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          set -eu
          v="${GITHUB_REF_NAME#v}"
          cd files
          python3 - "$v" <<'PY'
          import hashlib, json, sys
          entry = lambda name: {"name": name, "size": len(open(name, "rb").read()), "sha256": hashlib.sha256(open(name, "rb").read()).hexdigest()}
          with open("tterm-app.json", "w") as f:
              json.dump({"product": "tterm-app", "version": sys.argv[1], "files": {"macos": entry("tTerm.app.tar.gz")}, "dmg": entry("tTerm.dmg")}, f, indent=1, sort_keys=True)
              f.write("\n")
          PY
          sha256sum tTerm.dmg tTerm.app.tar.gz > SHA256SUMS
          [ -n "$AGENT_SIGNING_KEY" ] || { echo "no AGENT_SIGNING_KEY in the secrets"; exit 1; }
          umask 077
          # The key goes to openssl through a pipe, never to a file.
          printf '%s\n' "$AGENT_SIGNING_KEY" | openssl pkeyutl -sign -inkey /dev/stdin -rawin -in tterm-app.json -out "$RUNNER_TEMP/sig.bin"
          base64 -w0 "$RUNNER_TEMP/sig.bin" > tterm-app.json.sig
          # Checked with the public key the apps carry, as they will.
          python3 -c 'import sys; open(sys.argv[1], "wb").write(bytes.fromhex("302a300506032b6570032100" + open(sys.argv[2]).read().strip()))' \
            "$RUNNER_TEMP/pub.der" ../agent/release-key.pub
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$RUNNER_TEMP/pub.der" -rawin \
            -in tterm-app.json -sigfile "$RUNNER_TEMP/sig.bin"
          cat tterm-app.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --latest --title "tTerm $v" \
            --notes "tTerm $v for Mac (Intel and Apple silicon): download tTerm.dmg and drag tTerm to Applications. Signed with tTerm's own certificate, not Apple's yet: the first time, macOS asks whether to open it (System Settings, Privacy & Security, Open Anyway). From then on it updates itself, taking a version only when the signature of tterm-app.json checks." \
            files/tTerm.dmg files/tTerm.app.tar.gz files/tterm-app.json files/tterm-app.json.sig files/SHA256SUMS
