[package]
name = "tterm-agent"
description = "tTerm's agent: connects a computer to tTerm Web, the engine of the app without its window."
# The agent's own numbers, going on from agent.py 0.13.0; not the app's.
version = "0.14.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "tterm_agent"
path = "src/lib.rs"

[[bin]]
name = "tterm-agent"
path = "src/main.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["user"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
tterm-engine = { path = "../engine" }

[dev-dependencies]
libc = "0.2"
