[package]
name = "tterm-agent"
description = "tTerm's agent: connects a computer to tTerm Web, the engine of the app without its window."
# The agent's own numbers, going on from agent.py 0.13.0; not the app's.
version = "0.14.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "tterm_agent"
path = "src/lib.rs"

[[bin]]
name = "tterm-agent"
path = "src/main.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["user", "process"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
tterm-engine = { path = "../engine" }
# Updating itself (update.rs): the signature of a release checked with
# ring, already the link's TLS; its files over HTTPS by reqwest, as the
# app reaches tTerm Web, with the link's TLS and proxy.
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
libc = "0.2"
# A release of the agent on this computer, over TLS, for the checks of its
# updates (tests/update.rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
