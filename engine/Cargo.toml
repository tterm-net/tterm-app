[package]
name = "tterm-engine"
description = "The engine of tTerm on a computer: its shells, answering the page of tTerm Web as the core does."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# tTerm Web in the cloud, for the app (from 0.3.0): signing in with the
# browser, the page's requests and its socket to app.tterm.net. The agent
# has no need of it, and builds without it.
cloud = ["dep:reqwest", "dep:ring", "dep:zeroize", "dep:ssh-key", "dep:num-bigint"]

[dependencies]
base64 = "0.22"
flate2 = "1"
libc = "0.2"
nix = { version = "0.29", features = ["term", "process", "signal", "fs", "user", "hostname"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The system's languages (from 0.6.0, say.rs): on a Mac, System Settings'
# preferred languages; elsewhere LANG and the like.
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
# The network: the link to tTerm Web's hub for the agent and, later, the
# app (link.rs), and with `cloud` the app's own way to tTerm Web. TLS by
# rustls on ring, roots of Mozilla and of the system, one setting for both
# (link::tls_config); WebSocket by tokio-tungstenite.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
ring = { version = "0.17", optional = true }
# The vault (from 0.7.0, with `cloud`): its keys wiped from memory when
# let go (zeroize); its boxes and derived keys are ring's (crypto.rs).
# The person's SSH keys read from ~/.ssh as OpenSSH writes them, those with
# a passphrase too (ssh-key, RustCrypto's: only its parsing and OpenSSH's
# own encryption, none of its signing, which ring does); the numbers of an
# RSA key's JWK that the OpenSSH form does not carry (num-bigint).
zeroize = { version = "1", optional = true }
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ecdsa", "encryption", "rsa"], optional = true }
num-bigint = { version = "0.4", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
webpki-roots = "1"

[dev-dependencies]
libc = "0.2"
# The vault's checks (tests/vaultkeys.rs) read back the public half of keys
# and verify raw signatures; ring is the cloud feature's already.
ring = "0.17"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ecdsa"] }
# The checks' tTerm Web in the cloud, for the cloud feature (tests/cloud.rs),
# and the hub of the link's checks (tests/link.rs).
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "test-util"] }
# Releases of the app on this computer, over TLS, for the checks of its
# updates (tests/update.rs), as the agent's (agent/tests/update.rs).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
