[package]
name = "tterm-engine"
description = "The engine of tTerm on a computer: its shells, answering the page of tTerm Web as the core does."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# tTerm Web in the cloud, for the app (from 0.3.0): signing in with the
# browser, the page's requests and its socket to app.tterm.net. The agent
# has no need of it, and builds without it.
cloud = ["dep:reqwest", "dep:ring", "dep:rustls", "dep:rustls-native-certs", "dep:webpki-roots", "dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
base64 = "0.22"
flate2 = "1"
libc = "0.2"
nix = { version = "0.29", features = ["term", "process", "signal", "fs", "user", "hostname"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
# The network, with the crates the agent's link uses: TLS by rustls on ring,
# roots of Mozilla and of the system, WebSocket by tokio-tungstenite.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
ring = { version = "0.17", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"], optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
libc = "0.2"
# The checks' tTerm Web in the cloud, for the cloud feature (tests/cloud.rs).
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "test-util"] }
