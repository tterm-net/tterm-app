[package]
name = "tterm-engine"
description = "The engine of tTerm on a computer: its shells, answering the page of tTerm Web as the core does."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["term", "process", "signal", "fs", "user", "hostname"] }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "test-util"] }
